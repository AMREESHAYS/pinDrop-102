[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # @netlify/blobs 11 needs Node 22.12+; functions run on the build's Node version.
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://tmpfiles.org https://*.catbox.moe https://*.r2.cloudflarestorage.com; media-src 'self' blob: https://tmpfiles.org https://*.catbox.moe https://*.r2.cloudflarestorage.com; connect-src 'self' https://tmpfiles.org https://*.catbox.moe https://api.gofile.io https://*.gofile.io https://*.r2.cloudflarestorage.com; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"
